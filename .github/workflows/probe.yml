name: probe4
on: [push]
permissions:
  contents: write
jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - name: Sync bot.py to Android python sources
        run: |
          mkdir -p android/app/src/main/python
          cp bot.py android/app/src/main/python/bot.py
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"
          cache-disabled: true
      - name: Write local.properties with the SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Build Android APK
        working-directory: ./android
        run: gradle assembleDebug --stacktrace --no-daemon
      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/spambuster.apk
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spambuster-apk
          path: dist/spambuster.apk
          retention-days: 30
      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"