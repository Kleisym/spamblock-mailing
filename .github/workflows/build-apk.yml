name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Android APK
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../spambuster.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spambuster-apk
          path: spambuster.apk
          retention-days: 30

      - name: Publish Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "Spambuster v1.0.0 (Android APK)"
          body: |
            ### 📱 Скачать приложение для Android:
            Скачайте файл **spambuster.apk** ниже, установите на телефон и нажмите «Запустить 24/7».
          files: spambuster.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
