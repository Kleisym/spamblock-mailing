name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync bot.py to Android python sources
        run: |
          mkdir -p android/app/src/main/python
          cp bot.py android/app/src/main/python/bot.py

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Build Android APK
        working-directory: ./android
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk spambuster.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spambuster-apk
          path: spambuster.apk
          retention-days: 30

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Publish Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0-${{ steps.sha.outputs.short }}
          name: "Spambuster APK (build ${{ steps.sha.outputs.short }})"
          make_latest: true
          body: |
            ### 📱 Скачать приложение для Android
            Скачай файл **spambuster.apk** ниже, установи на телефон и нажми «Запустить».

            - **Вшит полноценный Python + Telethon** (Chaquopy)
            - Запрос кода авторизации и 2FA прямо в диалоговом окне приложения
            - Работает в фоне 24/7 (Foreground Service + WakeLock)
            - Автоматически перезапускается после перезагрузки телефона (BootReceiver)
            - Обход энергосбережения MIUI / OneUI / HyperOS
          files: spambuster.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
