name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync bot.py into the Android python sources
        run: |
          mkdir -p android/app/src/main/python
          cp bot.py android/app/src/main/python/bot.py

      - name: Verify the copies are identical
        run: |
          if ! cmp -s bot.py android/app/src/main/python/bot.py; then
            echo "bot.py and the Android copy diverged"
            exit 1
          fi

      - name: Run test suite
        run: python -m pytest tests/ -q

  build:
    name: Build & Release APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Sync bot.py to Android python sources
        run: |
          mkdir -p android/app/src/main/python
          cp bot.py android/app/src/main/python/bot.py

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"
          cache-disabled: true

      - name: Write local.properties with the SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Build Android APK
        working-directory: ./android
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/spambuster.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spambuster-apk
          path: dist/spambuster.apk
          retention-days: 30

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, "refs/tags/v")
        with:
          name: Spambuster release
          make_latest: true
          body: |
            Скачай **spambuster.apk** ниже, установи на телефон и нажми «Запустить».

            - Вшит Python + Telethon (Chaquopy)
            - Код авторизации и 2FA запрашиваются прямо в приложении
            - Foreground Service + WakeLock: работает при закрытом приложении и заблокированном экране
            - Автозапуск после перезагрузки телефона
            - Автогашение спам-пингов только по реальным упоминаниям
          files: dist/spambuster.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}